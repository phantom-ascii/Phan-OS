<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>phanOS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="top-bar">
      <p>PHAN OS</p>
      <p id="timeElement"></p>
    </header>

    <main id="desktop">
      <div class="app-icon" id="stopwatch">
        <img src="./Images/stopwatch.png" alt="Stopwatch" />
      </div>

      <div class="app-icon" id="socials">
        <img src="./Images/socials.png" alt="Socials" />
      </div>
      <div class="app-icon" id="welcomeApp">
        <img src="./Images/pfp.jpg" alt="Welcome" />
      </div>
      <div class="app-icon" id="cookieClicker">
        <img src="./Images/pfp.jpg" alt="Cookie Clicker" />
      </div>
      <div class="app-icon" id="aboutMe">
        <img src="./Images/pfp.jpg" alt="About Me" />
      </div>
      <div class="app-icon" id="terminal">
        <img src="./Images/terminal.png" alt="Terminal" />
      </div>
      <div class="app-icon" id="scuba">
        <img src="./Images/scubacat.gif" alt="Scuba" />
      </div>
      <div class="app-icon" id="calculator">
        <img src="./Images/calculator.png" alt="Calculator" />
      </div>
      <div class="app-icon" id="clock">
        <img src="./Images/clock.png" alt="clock"/>
      </div>
      <div class="app-icon" id="notes">
        <img src="./Images/notes.png" alt="Notes"/>
      </div>
    </main>

    <div id="welcome" class="window welcome-window">
      <div class="window-header">
        <span>Welcome</span>
        <button class="close-button">x</button>
      </div>

      <div class="window-content">
        <h6>How did you get this website??? Anyways...</h6>
        <img src="./Images/pfp.jpg" alt="My PFP" class="pfp" />
        <h1>phanOS</h1>
        <h2>An OS all about phantom-ascii (me)</h2>
        <h5>(movable window btw)</h5>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
